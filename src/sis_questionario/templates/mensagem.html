{% extends "base.html" %}
{% block content %}
<section class="mx-auto max-w-xl py-6 text-center sm:py-14">
    <div class="rounded-3xl border border-slate-200 bg-white px-6 py-10 shadow-sm sm:px-12 sm:py-12">
        {% block status_icon %}{% endblock %}
        <p class="mt-7 text-xs font-semibold tracking-widest text-teal-700 uppercase">{% block eyebrow %}Sua participação{% endblock %}</p>
        <h1 class="mt-3 text-3xl leading-tight font-bold tracking-tight text-slate-900">{% block heading %}{% endblock %}</h1>
        <div class="mt-4 space-y-3 text-sm leading-7 text-slate-600">{% block description %}{% endblock %}</div>
        <a href="{{ url_for('index') }}" class="mt-8 inline-flex min-h-12 w-full items-center justify-center gap-3 rounded-xl bg-teal-800 px-6 py-3.5 text-sm font-semibold text-white transition-colors hover:bg-teal-900 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-teal-700 sm:w-auto">{% block action %}Voltar à página inicial{% endblock %}<span aria-hidden="true">→</span></a>
    </div>
</section>
{% endblock %}
