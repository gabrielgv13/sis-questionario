<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <title>{% block title %}Questionário{% endblock %} · Pesquisa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="min-h-screen font-sans text-slate-700 antialiased">
    <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:rounded-lg focus:bg-teal-800 focus:px-4 focus:py-3 focus:text-white">Ir para o conteúdo</a>
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex min-h-20 max-w-6xl items-center justify-between gap-4 px-5 sm:px-8">
            <a href="{{ url_for('index') }}" class="flex items-center gap-3 rounded-lg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-teal-700" aria-label="Questionário — página inicial">
                <span class="flex size-10 items-center justify-center rounded-xl bg-teal-800 text-white" aria-hidden="true">
                    <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8a2 2 0 0 1 2 2v14H6V6a2 2 0 0 1 2-2Z"/><path d="M9 3h6v4H9zM9 11h6M9 15h4"/></svg>
                </span>
                <span class="text-lg font-bold tracking-tight text-slate-900">Questionário<span class="text-teal-700">.</span></span>
            </a>
            <span class="hidden items-center gap-2 text-xs font-medium text-slate-500 sm:flex"><span class="size-1.5 rounded-full bg-teal-600"></span> Um espaço para conhecer você</span>
        </div>
    </header>
    <main id="conteudo" class="mx-auto min-h-[calc(100vh-10.5rem)] max-w-6xl px-5 py-10 sm:px-8 sm:py-14" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
    <footer class="border-t border-slate-200">
        <div class="mx-auto flex max-w-6xl flex-col gap-2 px-5 py-6 text-xs leading-5 text-slate-500 sm:flex-row sm:items-center sm:justify-between sm:px-8">
            <p>Sua participação faz a diferença.</p>
            <p>Uma pergunta de cada vez. Um novo ponto de vista.</p>
        </div>
    </footer>
</body>
</html>
