[project]
name = "sis-questionario"
version = "0.1.0"
description = "Sistema de questionários com FastAPI e PostgreSQL"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.36.0",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.20",
    "werkzeug>=3.1.3",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.0",
    "python-dotenv>=1.0",
    "reportlab>=5.1.0",
]

[project.scripts]
sis-questionario = "sis_questionario:main"
sis-questionario-perfil = "sis_questionario:main_perfil"
sis-questionario-db = "sis_questionario.setup_db:main"
sis-questionario-provision = "sis_questionario.provision:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx>=0.28.1", "pyyaml>=6.0.3"]
