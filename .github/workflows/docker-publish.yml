name: Test and publish Docker images

on:
  workflow_dispatch:
  push:
    branches: [main, feat/docker-render]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sis_ci
      COMPOSE_PROFILES: clean,test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          for key in ADMIN_PASSWORD SECRET_KEY POSTGRES_PASSWORD DB_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Validate configuration and build both variants
        run: |
          docker compose config --quiet
          docker compose build --pull
      - name: Prepare test databases explicitly with SQL
        shell: bash
        run: |
          docker compose up -d --wait db-clean db-test
          for variant in clean test; do
            sed "s/SUBSTITUA_POR_UMA_SENHA_ALEATORIA_COM_24_OU_MAIS_CARACTERES/$DB_PASSWORD/" src/sis_questionario/banco.sql |
              docker compose exec -T "db-$variant" psql -U sis_owner -d sis_questionario -v ON_ERROR_STOP=1
          done
      - name: Start both variants
        run: docker compose up -d --wait --wait-timeout 180
      - name: Check initial databases
        run: |
          for variant in clean test; do
            docker compose exec -T "web-$variant" python -c "from sis_questionario import bd_exec as db; c=db.conectar(); tables=('alunos','questionarios','perguntas','opcoes','envios','respostas'); assert all(c.execute('SELECT COUNT(*) AS n FROM '+t).fetchone()['n']==0 for t in tables); c.close()"
          done
          curl --fail http://localhost:5000/healthz
          curl --fail http://localhost:5001/healthz
      - name: Run full suite against password-authenticated PostgreSQL
        run: |
          docker compose run --rm --no-deps \
            -e "TEST_DATABASE_URL=postgresql://sis_owner:${POSTGRES_PASSWORD}@db-clean:5432/sis_questionario?connect_timeout=5" \
            -v "$PWD/tests:/validation/tests:ro" \
            -v "$PWD/docs:/validation/docs:ro" \
            -v "$PWD/images:/validation/images:ro" \
            -v "$PWD/src:/validation/src:ro" \
            web-clean python -m unittest discover -s /validation/tests -v
      - name: Verify restart preserves readiness
        run: |
          docker compose restart web-clean web-test
          docker compose up -d --wait --wait-timeout 90
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo 'Configure the repository secret DOCKERHUB_TOKEN before publishing.'
            exit 1
          fi
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: gabrielgventura
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested images
        run: |
          for variant in clean test; do
            image="gabrielgventura/sis-questionario"
            docker tag "$image:$variant" "$image:$variant-${GITHUB_SHA}"
            docker push "$image:$variant-${GITHUB_SHA}"
            docker push "$image:$variant"
          done
      - name: Write image references
        run: |
          echo '### Docker Hub images' >> "$GITHUB_STEP_SUMMARY"
          echo '- `docker.io/gabrielgventura/sis-questionario:clean`' >> "$GITHUB_STEP_SUMMARY"
          echo '- `docker.io/gabrielgventura/sis-questionario:test`' >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable tags: clean-${GITHUB_SHA} and test-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 80
      - name: Stop ephemeral test services
        if: always()
        run: docker compose down
